<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZION PRIME Z</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #0b1325; color: #fff; height: 100vh; display: flex; flex-direction: column; }
        .header { display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; background-color: #0f192e; border-bottom: 1px solid #1e2d4a; }
        .header h1 { font-size: 18px; color: #38bdf8; letter-spacing: 1px; }
        .clear-btn { background-color: #ef4444; color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .chat-container { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; }
        .message { max-width: 85%; padding: 12px 16px; border-radius: 12px; line-height: 1.5; font-size: 15px; word-wrap: break-word; }
        .user-message { background-color: #0284c7; align-self: flex-end; border-bottom-right-radius: 2px; }
        .bot-message { background-color: #1e293b; align-self: flex-start; border-bottom-left-radius: 2px; border-left: 3px solid #38bdf8; }
        .bot-message img { max-width: 100%; border-radius: 8px; margin-top: 10px; display: block; border: 1px solid #38bdf8; }
        
        .preview-container { padding: 5px 15px; background: #0f192e; display: none; }
        .preview-container img { height: 60px; border-radius: 6px; border: 1px solid #38bdf8; }

        .input-container { padding: 12px; background-color: #0f192e; border-top: 1px solid #1e2d4a; display: flex; gap: 8px; align-items: center; }
        .input-box { flex: 1; background-color: #1e293b; border: 1px solid #334155; color: white; padding: 12px; border-radius: 8px; outline: none; font-size: 15px; }
        .icon-btn { background-color: #1e293b; border: 1px solid #334155; color: #38bdf8; padding: 10px 14px; border-radius: 8px; cursor: pointer; font-size: 16px; display: flex; align-items: center; justify-content: center; }
        .send-btn { background-color: #0284c7; color: white; border: none; padding: 12px 18px; border-radius: 8px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>
    <div class="header">
        <h1>ZION PRIME Z</h1>
        <button class="clear-btn" onclick="clearChat()">Clear Chat</button>
    </div>

    <div class="chat-container" id="chat"></div>

    <div class="preview-container" id="previewContainer">
        <img id="imagePreview" src="" alt="Upload Preview">
    </div>

    <div class="input-container">
        <!-- Image Upload Button -->
        <label for="imageInput" class="icon-btn">📎</label>
        <input type="file" id="imageInput" accept="image/*" style="display: none;" onchange="handleImageSelect(event)">
        
        <input type="text" id="prompt" class="input-box" placeholder="Type prompt..." onkeydown="if(event.key==='Enter') sendMessage()">
        
        <!-- Speech to Text Mic Button -->
        <button class="icon-btn" onclick="startSpeechRecognition()">🎤</button>
        
        <!-- Send Button -->
        <button class="send-btn" onclick="sendMessage()">➤</button>
    </div>

    <script>
        let selectedBase64Image = null;

        function handleImageSelect(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    selectedBase64Image = e.target.result;
                    document.getElementById('imagePreview').src = selectedBase64Image;
                    document.getElementById('previewContainer').style.display = 'block';
                };
                reader.readAsDataURL(file);
            }
        }

        function speakText(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel(); // Stop prior speech
                const cleanText = text.replace(/!\[.*?\]\(.*?\)/g, '').replace(/[*_#`]/g, ''); // strip markdown
                const utterance = new SpeechSynthesisUtterance(cleanText);
                utterance.rate = 1.0;
                window.speechSynthesis.speak(utterance);
            }
        }

        function startSpeechRecognition() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                alert("Speech recognition is not supported in this browser.");
                return;
            }
            const recognition = new SpeechRecognition();
            recognition.lang = 'en-US';
            recognition.onresult = function(event) {
                document.getElementById('prompt').value = event.results[0][0].transcript;
            };
            recognition.start();
        }

        async function sendMessage() {
            const input = document.getElementById('prompt');
            const chat = document.getElementById('chat');
            const text = input.value.trim();
            if (!text && !selectedBase64Image) return;

            let userHTML = text;
            if (selectedBase64Image) {
                userHTML += `<br><img src="${selectedBase64Image}" style="max-height:150px; margin-top:5px; border-radius:6px;">`;
            }

            chat.innerHTML += `<div class="message user-message">${userHTML}</div>`;
            
            const payload = { prompt: text, image: selectedBase64Image };

            // Reset input and preview
            input.value = '';
            selectedBase64Image = null;
            document.getElementById('previewContainer').style.display = 'none';
            document.getElementById('imageInput').value = '';
            chat.scrollTop = chat.scrollHeight;

            const loadingId = 'loading-' + Date.now();
            chat.innerHTML += `<div class="message bot-message" id="${loadingId}">Generating response...</div>`;
            chat.scrollTop = chat.scrollHeight;

            try {
                const res = await fetch('/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const data = await res.json();
                const renderedHtml = marked.parse(data.result);
                document.getElementById(loadingId).innerHTML = `<b>Zion Prime Z:</b><br>${renderedHtml}`;
                
                // Read response out loud
                speakText(data.result);

            } catch (err) {
                document.getElementById(loadingId).innerText = "Error getting response.";
            }
            chat.scrollTop = chat.scrollHeight;
        }

        async function clearChat() {
            await fetch('/clear', { method: 'POST' });
            document.getElementById('chat').innerHTML = '';
            window.speechSynthesis.cancel();
        }
    </script>
</body>
</html>
