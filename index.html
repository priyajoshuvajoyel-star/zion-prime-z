<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zion Prime Z</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --panel-bg: #131c2e;
            --accent-color: #ff4757;
            --text-main: #ffffff;
            --text-muted: #94a3b8;
        }
        body { background: var(--bg-color); color: var(--text-main); font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0; display: flex; flex-direction: column; height: 100vh; box-sizing: border-box; }
        
        /* Header / UI Banner */
        header { background: var(--panel-bg); padding: 15px 20px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #1e293b; }
        header h1 { margin: 0; font-size: 1.2rem; letter-spacing: 1px; color: var(--accent-color); font-weight: bold; }
        .status-badge { background: rgba(255, 71, 87, 0.1); color: var(--accent-color); padding: 4px 10px; border-radius: 20px; font-size: 0.8rem; border: 1px solid rgba(255, 71, 87, 0.3); }

        /* Chat Workspace */
        #chat-container { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
        .message { padding: 12px 16px; border-radius: 12px; max-width: 85%; word-break: break-word; white-space: pre-wrap; line-height: 1.5; font-size: 0.95rem; }
        .user { background: var(--accent-color); align-self: flex-end; color: #fff; box-shadow: 0 4px 12px rgba(255, 71, 87, 0.3); }
        .bot { background: var(--panel-bg); align-self: flex-start; border: 1px solid #1e293b; color: var(--text-main); }
        
        .message img { max-width: 100%; border-radius: 8px; margin-top: 10px; display: block; border: 1px solid #334155; }

        /* Input Footer */
        #input-container { background: var(--panel-bg); padding: 15px 20px; display: flex; gap: 10px; border-top: 1px solid #1e293b; align-items: center; }
        input { flex: 1; padding: 12px 16px; border-radius: 8px; border: 1px solid #334155; background: #0b0f19; color: var(--text-main); font-size: 1rem; outline: none; }
        input:focus { border-color: var(--accent-color); }
        button { padding: 12px 20px; background: var(--accent-color); color: #fff; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; transition: opacity 0.2s; }
        button:active { opacity: 0.8; }
    </style>
</head>
<body>
    <header>
        <h1>ZION PRIME Z</h1>
        <div class="status-badge">SYSTEM ACTIVE</div>
    </header>

    <div id="chat-container">
        <div class="message bot">Zion Prime Z spatial intelligence online. How can I assist your project today?</div>
    </div>

    <div id="input-container">
        <input type="text" id="user-input" placeholder="Type a message, prompt code, or generate image..." autofocus>
        <button onclick="sendMessage()">Send</button>
    </div>

    <script>
        async function sendMessage() {
            const input = document.getElementById('user-input');
            const container = document.getElementById('chat-container');
            const text = input.value.trim();
            if (!text) return;

            const userDiv = document.createElement('div');
            userDiv.className = 'message user';
            userDiv.textContent = text;
            container.appendChild(userDiv);
            input.value = '';
            container.scrollTop = container.scrollHeight;

            const botDiv = document.createElement('div');
            botDiv.className = 'message bot';
            botDiv.textContent = 'Processing...';
            container.appendChild(botDiv);
            container.scrollTop = container.scrollHeight;

            try {
                const response = await fetch('/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text })
                });

                const data = await response.json();
                botDiv.textContent = data.response || "";

                if (data.image_url) {
                    const img = document.createElement('img');
                    img.src = data.image_url;
                    img.onload = () => { container.scrollTop = container.scrollHeight; };
                    botDiv.appendChild(img);
                }
            } catch (err) {
                botDiv.textContent = "Error communicating with backend cluster.";
            }
            container.scrollTop = container.scrollHeight;
        }

        document.getElementById('user-input').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') sendMessage();
        });
    </script>
</body>
</html>
