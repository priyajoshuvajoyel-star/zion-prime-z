<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zion Prime Z</title>
    <style>
        body { background: #121212; color: #fff; font-family: sans-serif; margin: 0; padding: 20px; display: flex; flex-direction: column; height: 100vh; box-sizing: border-box; }
        #chat-container { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
        .message { padding: 10px 15px; border-radius: 10px; max-width: 85%; word-break: break-word; white-space: pre-wrap; line-height: 1.4; }
        .user { background: #ff4757; align-self: flex-end; }
        .bot { background: #2f3542; align-self: flex-start; }
        .message img { max-width: 100%; border-radius: 8px; margin-top: 10px; display: block; border: 1px solid #444; }
        .message pre, .message code { background: #1e1e1e; padding: 8px; border-radius: 5px; font-family: monospace; display: block; overflow-x: auto; margin-top: 5px; }
        #input-container { display: flex; gap: 10px; }
        input { flex: 1; padding: 12px; border-radius: 5px; border: none; background: #2f3542; color: #fff; font-size: 16px; }
        button { padding: 12px 20px; background: #ff4757; color: #fff; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <div id="chat-container">
        <div class="message bot">Zion Prime Z online. How can I help you?</div>
    </div>
    <div id="input-container">
        <input type="text" id="user-input" placeholder="Type or speak a message..." autofocus>
        <button onclick="sendMessage()">Send</button>
    </div>

    <script>
        async function sendMessage() {
            const input = document.getElementById('user-input');
            const container = document.getElementById('chat-container');
            const text = input.value.trim();
            if (!text) return;

            const userDiv = document.createElement('div');
            userDiv.className = 'message user';
            userDiv.textContent = text;
            container.appendChild(userDiv);
            input.value = '';
            container.scrollTop = container.scrollHeight;

            const botDiv = document.createElement('div');
            botDiv.className = 'message bot';
            botDiv.textContent = 'Thinking...';
            container.appendChild(botDiv);
            container.scrollTop = container.scrollHeight;

            try {
                const response = await fetch('/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text })
                });

                const data = await response.json();
                botDiv.textContent = data.response || "";

                if (data.image_url) {
                    const img = document.createElement('img');
                    img.src = data.image_url;
                    img.onload = () => { container.scrollTop = container.scrollHeight; };
                    botDiv.appendChild(img);
                }
            } catch (err) {
                botDiv.textContent = "Error connecting to server.";
            }
            container.scrollTop = container.scrollHeight;
        }

        document.getElementById('user-input').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') sendMessage();
        });
    </script>
</body>
</html>
