<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZION PRIME Z</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#0d1527">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Zion Prime Z">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/4712/4712010.png">
    <style>
        body { margin: 0; padding: 0; background-color: #0d1527; color: #fff; font-family: sans-serif; display: flex; flex-direction: column; height: 100vh; }
        header { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; background: #131e36; border-bottom: 1px solid #1e2d4d; }
        header h1 { margin: 0; font-size: 18px; color: #38bdf8; letter-spacing: 1px; }
        .btn-clear { background: #ef4444; color: white; border: none; padding: 6px 14px; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: bold; }
        #chat-box { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
        .msg { padding: 12px; border-radius: 10px; max-width: 85%; font-size: 14px; line-height: 1.4; word-wrap: break-word; }
        .user { background: #0284c7; align-self: flex-end; color: white; }
        .bot { background: #1e293b; border-left: 3px solid #38bdf8; align-self: flex-start; color: #e2e8f0; }
        .msg img { max-width: 100%; border-radius: 8px; margin-top: 8px; display: block; }
        footer { padding: 10px 12px; background: #131e36; display: flex; gap: 8px; align-items: center; }
        .input-container { flex: 1; display: flex; align-items: center; background: #0d1527; border: 1px solid #334155; border-radius: 8px; padding: 0 8px; }
        input[type="text"] { flex: 1; padding: 12px 6px; border: none; background: transparent; color: white; outline: none; font-size: 14px; }
        button.action-btn { background: #0284c7; color: white; border: none; padding: 10px 14px; border-radius: 8px; cursor: pointer; font-size: 16px; display: flex; align-items: center; justify-content: center; }
        label.file-label { background: #1e293b; padding: 8px 12px; border-radius: 8px; cursor: pointer; font-size: 18px; color: #38bdf8; border: 1px solid #334155; }
        input[type="file"] { display: none; }
        .mic-btn { background: transparent; border: none; color: #38bdf8; font-size: 18px; cursor: pointer; padding: 4px; }
    </style>
</head>
<body>
    <header>
        <span style="font-size:22px; cursor:pointer; color:#38bdf8;">&#9776;</span>
        <h1>ZION PRIME Z</h1>
        <button class="btn-clear" onclick="clearHistory()">Clear Chat</button>
    </header>

    <div id="chat-box"></div>

    <footer>
        <label class="file-label" for="img-input">&#128206;</label>
        <input type="file" id="img-input" accept="image/*" onchange="previewImage(event)">
        
        <div class="input-container">
            <input type="text" id="prompt-input" placeholder="Type prompt..." onkeydown="if(event.key==='Enter') sendMsg()">
            <button class="mic-btn" onclick="startSpeech()" title="Voice Input">&#127908;</button>
        </div>
        
        <button class="action-btn" onclick="sendMsg()">&#10148;</button>
    </footer>

    <script>
        let selectedBase64 = "";

        function speakText(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const cleanText = text.replace(/!\[.*?\]\(.*?\)/g, '').replace(/<[^>]*>?/gm, '');
                const utterance = new SpeechSynthesisUtterance(cleanText);
                utterance.lang = 'en-US';
                window.speechSynthesis.speak(utterance);
            }
        }

        function formatMessage(text) {
            return text.replace(/!\[.*?\]\((.*?)\)/g, '<img src="$1" />');
        }

        function previewImage(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    selectedBase64 = e.target.result;
                    appendMessage("user", `<img src="${selectedBase64}" /><br><i>Image attached</i>`);
                    saveHistory();
                };
                reader.readAsDataURL(file);
            }
        }

        async function sendMsg() {
            const promptInput = document.getElementById('prompt-input');
            const prompt = promptInput.value.trim();
            if (!prompt && !selectedBase64) return;

            if (prompt) appendMessage("user", prompt);
            saveHistory();

            const currentImg = selectedBase64;
            promptInput.value = '';
            selectedBase64 = '';
            document.getElementById('img-input').value = '';

            const botMsgDiv = appendMessage("bot", "Thinking...");

            try {
                const res = await fetch('https://zion-prime-z.onrender.com/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt: prompt, image: currentImg })
                });
                const data = await res.json();
                const reply = data.result || "No response received.";
                botMsgDiv.innerHTML = "<b>Zion Prime Z:</b><br>" + formatMessage(reply);
                speakText(reply);
            } catch (err) {
                const errReply = "Error: " + err.message;
                botMsgDiv.innerHTML = "<b>Zion Prime Z:</b><br>" + errReply;
                speakText(errReply);
            }
            saveHistory();
        }

        function startSpeech() {
            if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                const recognition = new SpeechRecognition();
                recognition.lang = 'en-US';
                recognition.start();
                recognition.onresult = function(event) {
                    document.getElementById('prompt-input').value = event.results[0][0].transcript;
                };
            } else {
                alert("Speech recognition is not supported on this browser.");
            }
        }

        function appendMessage(sender, text) {
            const box = document.getElementById('chat-box');
            const div = document.createElement('div');
            div.className = `msg ${sender}`;
            div.innerHTML = sender === 'bot' && !text.startsWith('<b>') ? "<b>Zion Prime Z:</b><br>" + formatMessage(text) : text;
            box.appendChild(div);
            box.scrollTop = box.scrollHeight;
            return div;
        }

        function clearHistory() {
            if ('speechSynthesis' in window) window.speechSynthesis.cancel();
            document.getElementById('chat-box').innerHTML = '';
            localStorage.removeItem('zion_chat_history');
            fetch('https://zion-prime-z.onrender.com/clear', { method: 'POST' });
        }

        function saveHistory() {
            const box = document.getElementById('chat-box');
            localStorage.setItem('zion_chat_history', box.innerHTML);
        }

        window.onload = function() {
            const saved = localStorage.getItem('zion_chat_history');
            if (saved) document.getElementById('chat-box').innerHTML = saved;
        }
    </script>
</body>
</html>
